<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6fe0"/>
      <stop offset="55%" stop-color="#2d7ff9"/>
      <stop offset="100%" stop-color="#6a4dff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f5f8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(96, 96)">
    <rect width="72" height="72" fill="#ffffff"/>
    <text x="36" y="52" font-size="48" font-family="Arial, Helvetica, sans-serif"
          font-weight="900" fill="#2d7ff9" text-anchor="middle">A</text>
    <text x="96" y="52" font-size="38" font-family="-apple-system, Segoe UI, Roboto, sans-serif"
          font-weight="700" fill="#ffffff">Anki Browser</text>
  </g>

  <!-- Headline -->
  <g transform="translate(96, 280)">
    <text x="0" y="0" font-size="76" font-family="-apple-system, Segoe UI, Roboto, Helvetica, sans-serif"
          font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Review Anki decks,
    </text>
    <text x="0" y="92" font-size="76" font-family="-apple-system, Segoe UI, Roboto, Helvetica, sans-serif"
          font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      right in your browser.
    </text>
    <text x="0" y="170" font-size="28" font-family="-apple-system, Segoe UI, Roboto, sans-serif"
          font-weight="500" fill="#dde9ff">
      No account. No upload. Your file never leaves your device.
    </text>
  </g>

  <!-- Mock flashcard -->
  <g transform="translate(720, 110)">
    <rect x="0" y="0" width="380" height="240" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.4"/>
    <text x="24" y="44" font-size="13" font-family="Arial" font-weight="700"
          fill="#6b7280" letter-spacing="2">QUESTION</text>
    <text x="24" y="120" font-size="42" font-family="-apple-system, Segoe UI, sans-serif"
          font-weight="700" fill="#1f2329">Capital of France?</text>
    <line x1="24" y1="148" x2="356" y2="148" stroke="#d7dce3" stroke-width="2"/>
    <text x="24" y="186" font-size="13" font-family="Arial" font-weight="700"
          fill="#6b7280" letter-spacing="2">ANSWER</text>
    <text x="24" y="218" font-size="28" font-family="-apple-system, Segoe UI, sans-serif"
          font-weight="600" fill="#1f2329">Paris</text>
  </g>

  <!-- Rating buttons (decorative) -->
  <g transform="translate(720, 380)">
    <g>
      <rect x="0"   y="0" width="84" height="44" fill="#e0564b"/>
      <text x="42" y="28" font-size="14" font-family="Arial" font-weight="700"
            fill="#ffffff" text-anchor="middle">Again</text>
    </g>
    <g>
      <rect x="98"  y="0" width="84" height="44" fill="#e8a33d"/>
      <text x="140" y="28" font-size="14" font-family="Arial" font-weight="700"
            fill="#ffffff" text-anchor="middle">Hard</text>
    </g>
    <g>
      <rect x="196" y="0" width="84" height="44" fill="#4caf6e"/>
      <text x="238" y="28" font-size="14" font-family="Arial" font-weight="700"
            fill="#ffffff" text-anchor="middle">Good</text>
    </g>
    <g>
      <rect x="294" y="0" width="84" height="44" fill="#2d7ff9"/>
      <text x="336" y="28" font-size="14" font-family="Arial" font-weight="700"
            fill="#ffffff" text-anchor="middle">Easy</text>
    </g>
  </g>

  <!-- Footer attribution -->
  <text x="96" y="592" font-size="22" font-family="-apple-system, Segoe UI, sans-serif"
        font-weight="500" fill="#dde9ff">apps.endril.com/anki-browser</text>
</svg>